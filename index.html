<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>YouCut video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&family=Pacifico&family=Montserrat:wght@400;800&family=Lobster&family=Oswald:wght@500&family=Playfair+Display:wght@700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
/* VOICE: editor de bolsillo, negro puro, iconos blancos de línea, un rojo de acción y naranja para recortar
   IDEA: la app de móvil: inicio con borradores, pantalla arriba, cinta de clips con cabezal fijo, herramientas en carrusel
   PICTURE: la vista previa del vídeo y la cinta de miniaturas con líneas de música, texto y stickers encima
   COLOUR and TYPE: #000 fondo, #1c1c1e hojas, #ff3b5c acción, #ff9500 recorte, ámbar música; Inter
   LAYOUT: móvil = columna a pantalla completa con hoja inferior; PC = vista previa con panel lateral y pistas expandidas */
:root{color-scheme:dark;--bg:#000;--p1:#121214;--p2:#1c1c1e;--p3:#2c2c2e;--ln:#38383a;--ink:#fff;--mut:#8e8e93;--acc:#ff3b5c;--org:#ff9500;--aud:#f6c343;--aud2:#33c7a6;--txt:#3d8bff;--stk:#ff6fb5;--v2:#8e7dff}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.scr{position:fixed;inset:0;display:none;flex-direction:column;height:100dvh}
.scr.on{display:flex}
/* ---------- inicio ---------- */
#home{overflow-y:auto;padding:max(14px,env(safe-area-inset-top)) 0 30px}
.hh{display:flex;align-items:center;gap:10px;padding:6px 18px 4px}
.hh h1{margin:0;font-size:22px;font-weight:700;flex:1}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;flex:none}
.logo svg{width:18px;height:18px;fill:#fff}
.hero{padding:14px 18px 6px;display:grid;grid-template-columns:1.4fr 1fr;gap:12px;max-width:900px;width:100%;margin:0 auto}
.newbig{border-radius:18px;background:linear-gradient(135deg,#ff3b5c,#ff6a3d);min-height:150px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:18px;gap:2px;text-align:left;position:relative;overflow:hidden}
.newbig .plus{position:absolute;top:16px;left:16px;width:46px;height:46px;border-radius:50%;background:#fff;color:var(--acc);display:grid;place-items:center}
.newbig .plus svg{width:28px;height:28px;stroke-width:2.4}
.newbig b{font-size:20px}.newbig small{opacity:.85;font-size:13px}
.side2{display:grid;gap:12px}
.mini{border-radius:16px;background:var(--p2);display:flex;align-items:center;gap:10px;padding:14px;text-align:left;font-weight:600}
.mini svg{color:var(--acc)}
.mini small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.hsec{display:flex;align-items:center;justify-content:space-between;padding:22px 18px 10px;max-width:900px;width:100%;margin:0 auto}
.hsec h2{margin:0;font-size:17px}
.hsec span{color:var(--mut);font-size:13px}
.drafts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 18px;max-width:900px;width:100%;margin:0 auto}
.draft{position:relative;border-radius:14px;background:var(--p2);overflow:hidden;text-align:left}
.draft .th{aspect-ratio:16/10;background:#111 center/cover no-repeat;display:block;width:100%}
.draft .dur{position:absolute;right:8px;top:8px;background:#000a;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600}
.draft .meta{padding:8px 10px 10px;display:flex;align-items:center;gap:6px}
.draft .meta div{flex:1;overflow:hidden}
.draft b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.draft small{color:var(--mut);font-size:11px}
.dmore{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--mut)}
.dmore:hover{background:var(--p3);color:#fff}
.nodraft{color:var(--mut);padding:30px 18px;text-align:center;grid-column:1/-1}
/* ---------- editor ---------- */
#ed{background:var(--bg)}
.eh{height:52px;display:flex;align-items:center;gap:6px;padding:0 10px;padding-top:env(safe-area-inset-top);flex:none}
#pname{flex:1;background:transparent;border:1px solid transparent;color:var(--ink);font-weight:600;font-size:15px;padding:6px 8px;border-radius:8px;text-align:center;max-width:none}
#pname:focus{border-color:var(--ln);outline:none}
.ib{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.ib:hover{background:var(--p2)}
.ib:disabled{opacity:.3;pointer-events:none}
.save{height:34px;padding:0 16px;border-radius:9px;background:var(--acc);color:#fff;font-weight:700;flex:none}
.reschip{height:30px;padding:0 9px;border-radius:7px;border:1px solid var(--ln);font-size:12px;font-weight:600;color:#ddd;flex:none}
#main{flex:1;display:flex;min-height:0}
#stage{flex:1;min-height:150px;display:flex;align-items:center;justify-content:center;position:relative;background:#000;overflow:hidden}
#cv{display:block;background:#000;touch-action:none}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
#empty p{margin:0;color:var(--mut);max-width:360px}
.big{background:var(--acc);color:#fff;font-weight:700;height:46px;padding:0 22px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
.big:disabled{opacity:.4}
#drop{position:absolute;inset:10px;border:2px dashed var(--acc);border-radius:16px;background:#ff3b5c18;display:none;align-items:center;justify-content:center;font-size:18px;font-weight:600;z-index:5}
#side{display:none;width:360px;flex:none;background:var(--p1);border-left:1px solid var(--ln);flex-direction:column}
#transport{height:44px;flex:none;display:flex;align-items:center;gap:2px;padding:0 6px}
#tc{font-variant-numeric:tabular-nums;font-size:12px;color:var(--mut);white-space:nowrap;padding:0 6px;min-width:110px}
#tc b{color:#fff;font-weight:600}
#play{width:42px;height:42px;display:grid;place-items:center}
#play svg{fill:#fff;width:22px;height:22px}
.sp{flex:1}
.tw{position:relative;flex:none;height:clamp(150px,27dvh,250px);background:var(--bg)}
#tl{position:absolute;inset:0;overflow-x:scroll;overflow-y:auto;scrollbar-width:none;touch-action:pan-x pan-y}
#tl::-webkit-scrollbar{display:none}
#tli{position:relative;min-height:100%;padding-bottom:10px}
#ph{position:absolute;top:2px;bottom:6px;left:50%;width:2px;margin-left:-1px;background:#fff;border-radius:2px;pointer-events:none;z-index:20;box-shadow:0 0 4px #000}
#addEnd{position:absolute;right:10px;width:38px;height:38px;border-radius:9px;background:#fff;color:#000;display:grid;place-items:center;z-index:21;box-shadow:0 2px 10px #000a}
#addEnd svg{stroke-width:2.4}
.ruler{position:sticky;top:0;height:20px;z-index:12;background:var(--bg)}
.tick{position:absolute;top:0;font-size:10px;color:var(--mut);transform:translateX(-50%);line-height:20px;white-space:nowrap}
.tick.d{width:3px;height:3px;border-radius:50%;background:#555;top:9px;transform:none;margin-left:-1px}
.row{position:relative}
.rlab{position:sticky;left:0;z-index:9;display:none;align-items:center;gap:5px;height:18px;margin:4px 0 0 6px;padding:0 7px;border-radius:5px;font-size:10px;font-weight:600;background:#000c;color:var(--mut);pointer-events:none;white-space:nowrap;width:max-content}
.hint{position:absolute;top:3px;bottom:3px;border:1px dashed var(--ln);border-radius:7px;color:var(--mut);font-size:11px;display:flex;align-items:center;padding:0 10px;cursor:pointer;white-space:nowrap}
.hint:hover{border-color:var(--mut);color:#fff}
.clip{position:absolute;top:3px;bottom:3px;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--p3)}
.clip.sel{box-shadow:0 0 0 2px #fff;z-index:5;overflow:visible}
.clip .tiles{position:absolute;inset:0;display:flex;overflow:hidden;border-radius:6px;pointer-events:none}
.clip .tile{flex:none;height:100%;background-repeat:no-repeat}
.clip .lab{position:absolute;left:5px;bottom:3px;font-size:10px;font-weight:600;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap;pointer-events:none;display:flex;gap:4px;align-items:center;max-width:calc(100% - 8px);overflow:hidden}
.clip .badge{background:#000b;border-radius:4px;padding:0 4px}
.clip.aud{background-color:#f6c34340;background-repeat:no-repeat}
.clip.aud.a2{background-color:#33c7a640}
.clip.mut{opacity:.5}
.clip.line{top:3px;bottom:auto;height:7px;border-radius:4px;box-shadow:none}
.clip.line.sel{box-shadow:0 0 0 2px #fff}
.lineA1{background:var(--aud)!important}.lineA2{background:var(--aud2)!important}.lineV2{background:var(--v2)!important}.lineT{background:var(--txt)!important}.lineS{background:var(--stk)!important}
.clip.ov{border-radius:5px;font-size:11px;font-weight:600;color:#fff;display:flex;align-items:center;padding:0 8px;white-space:nowrap}
.clip.ov span{overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.clip.t{background:#2a64c4}.clip.s{background:#c2457f}
.clip.v2c{box-shadow:inset 0 0 0 2px var(--v2)}
.clip.v2c.sel{box-shadow:0 0 0 2px #fff}
.fadeL,.fadeR{position:absolute;top:0;bottom:0;pointer-events:none}
.fadeL{left:0;background:linear-gradient(to bottom right,#000a 50%,transparent 50%)}
.fadeR{right:0;background:linear-gradient(to bottom left,#000a 50%,transparent 50%)}
.h{position:absolute;top:-2px;bottom:-2px;width:16px;background:var(--org);cursor:ew-resize;z-index:6;display:grid;place-items:center;touch-action:none}
.h::after{content:"";width:2px;height:38%;background:#fff;border-radius:2px}
.h.l{left:-9px;border-radius:7px 0 0 7px}.h.r{right:-9px;border-radius:0 7px 7px 0}
.clip.line .h{top:-6px;bottom:-6px}
.tr{position:absolute;width:26px;height:22px;margin-left:-13px;border-radius:6px;background:#fff;color:#000;z-index:7;display:grid;place-items:center;box-shadow:0 1px 6px #000c}
.tr svg{width:16px;height:16px;stroke-width:2.4}
.tr.on{background:var(--acc);color:#fff}
#dock{flex:none;background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
#tools{border-top:1px solid #1c1c1e}
.gtabs{display:flex;gap:5px;overflow-x:auto;padding:7px 8px 2px;scrollbar-width:none}
.gtabs::-webkit-scrollbar,.tbar::-webkit-scrollbar{display:none}
.gtab{flex:none;background:#1c1c1e;color:#aeaeb2;font-size:12px;height:28px;padding:0 12px;border-radius:14px;white-space:nowrap}
.gtab.on{background:var(--acc);color:#fff}
.gtab.back{width:36px;padding:0;display:grid;place-items:center;color:#fff}.gtab.back svg{width:18px;height:18px}
.tbar{display:flex;overflow-x:auto;padding:0 4px 8px;scrollbar-width:none;scroll-behavior:smooth}
.tgrp{display:flex;flex-direction:column;flex:none;padding-right:4px;margin-right:4px;border-right:1px solid #2c2c2e}
.tgrp:last-child{border-right:0}
.tgl{font-size:10.5px;color:var(--mut);padding:4px 8px 0;white-space:nowrap}
.tgb{display:flex}
.tgrp .tool{background:var(--gc);color:#1d1d1f;width:66px;height:60px;margin:2px;border-radius:12px;font-weight:500}
.tgrp .tool:hover{background:var(--gc);filter:brightness(.93)}
.tgrp .tool.red{background:#ffd3d3;color:#8a1020}
.g-add{--gc:#cfe3ff}.g-vid{--gc:#ffd3e0}.g-col{--gc:#e4d7ff}.g-aud,.g-audc{--gc:#c8f1d4}.g-txt{--gc:#fff0b3}.g-stkg{--gc:#ffdcc4}.g-edi{--gc:#e3e3e8}.g-pro{--gc:#c6eeee}
.gtab[data-jump]::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gc);margin-right:6px;vertical-align:0}
.gtab.on[data-jump]{background:var(--gc);color:#1d1d1f}
.clip.blk{box-shadow:0 0 0 3px var(--org)!important;z-index:4}
.subrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--p2);border-radius:10px;padding:6px 8px}
.subrow small{color:var(--mut);font-variant-numeric:tabular-nums;font-size:11px;white-space:nowrap;cursor:pointer}
.subrow input{height:36px;padding:6px 9px;font-size:15px}
.tool{flex:none;width:68px;height:62px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;color:#e5e5ea;text-align:center;line-height:1.1}
.tool:hover{background:var(--p2)}
.tool.back{color:#fff;width:52px}
.tool.sep{width:1px;height:40px;background:var(--ln);margin:11px 4px;pointer-events:none}
.tool.red{color:#ff6b81}
#panel{display:none;flex-direction:column;background:var(--p1);border-radius:16px 16px 0 0;height:min(48dvh,340px)}
#panel.on{display:flex}
#side #panel{height:auto;flex:1;border-radius:0;background:transparent}
#tools.off{display:none}
.phd{display:flex;align-items:center;gap:8px;height:48px;padding:0 6px;flex:none;border-bottom:1px solid #2c2c2e}
.phd h3{margin:0;font-size:15px;font-weight:600;flex:1;text-align:center}
.pbtn{width:44px;height:40px;border-radius:9px;display:grid;place-items:center}
.pbtn.ok{color:var(--acc)}
.pbtn svg{stroke-width:2.4}
.pbd{flex:1;overflow:auto;padding:12px 16px 16px;display:flex;flex-wrap:wrap;gap:14px 26px;align-content:flex-start}
#side .pbd{flex-direction:column;flex-wrap:nowrap}
.fld{display:flex;flex-direction:column;gap:6px;min-width:200px;flex:1 1 220px;max-width:440px}
#side .fld{max-width:none;flex:none}
.fld.full{flex-basis:100%;max-width:none}
.fld>label{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.fld>label b{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border-radius:9px;background:var(--p2);border:1px solid var(--ln);font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:#ff3b5c26;border-color:var(--acc)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--ln)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
input[type=color]{width:36px;height:32px;border:1px solid var(--ln);border-radius:8px;background:var(--p2);padding:2px}
textarea,select,input[type=text]{background:var(--p2);border:1px solid var(--ln);color:#fff;border-radius:10px;padding:9px 11px;font:16px Inter,sans-serif;width:100%}
textarea{resize:vertical;min-height:64px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;width:100%}
.cell{aspect-ratio:1;border-radius:10px;background:var(--p2);display:grid;place-items:center;font-size:30px;overflow:hidden;padding:6px;border:1px solid transparent}
.cell:hover{border-color:var(--acc)}
.cell img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.cell.fx{font-size:11px;font-weight:600;text-align:center;line-height:1.2}
.cell.add{font-size:12px;color:var(--mut);text-align:center;border:1px dashed var(--ln)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;width:100%}
.fcell{border-radius:10px;overflow:hidden;font-size:11px;text-align:center;padding-bottom:4px;border:2px solid transparent}
.fcell canvas{width:100%;aspect-ratio:1;display:block;margin-bottom:4px;background:#333;border-radius:8px}
.fcell.on{border-color:var(--acc)}
.tabs{display:flex;gap:2px;width:100%;overflow-x:auto;scrollbar-width:none;margin:-6px 0 0;flex:none}
.tab{padding:7px 12px 9px;font-size:13px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:#fff;border-color:var(--acc)}
.note{font-size:12px;color:var(--mut);width:100%;margin:0}
.pbar{height:8px;background:var(--p3);border-radius:8px;overflow:hidden;width:100%}
.pbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.list{display:flex;flex-direction:column;gap:6px;width:100%}
.li{display:flex;align-items:center;gap:10px;background:var(--p2);border-radius:10px;padding:8px 10px}
.li b{flex:1;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{color:var(--mut)}
.rb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--p3)}
.rb.add{background:var(--acc)}
.rec{width:74px;height:74px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;margin:4px auto}
.rec i{width:54px;height:54px;border-radius:50%;background:var(--acc);transition:border-radius .2s,transform .2s}
.rec.on i{border-radius:10px;transform:scale(.6)}
/* recorte preciso */
.trimbox{position:relative;width:100%;height:64px;border-radius:8px;overflow:hidden;background:#222;touch-action:none;flex:none}
.tstrip{position:absolute;inset:0;display:flex}
.tstrip .tile{flex:none;height:100%;background-repeat:no-repeat}
.tsel{position:absolute;top:0;bottom:0;border:3px solid var(--org);border-left-width:0;border-right-width:0;box-shadow:0 0 0 999px #000a;cursor:grab}
.tsel.cut{box-shadow:none;background:#ff3b5c55;border-color:var(--acc)}
.th{position:absolute;top:-3px;bottom:-3px;width:18px;background:var(--org);display:grid;place-items:center;cursor:ew-resize}
.tsel.cut .th{background:var(--acc)}
.th::after{content:"";width:2px;height:40%;background:#fff;border-radius:2px}
.th.l{left:-18px;border-radius:6px 0 0 6px}.th.r{right:-18px;border-radius:0 6px 6px 0}
.tmark{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--org);border-radius:2px;cursor:ew-resize;box-shadow:0 0 0 2px #000}
.tmark::before{content:"";position:absolute;left:-12px;right:-12px;top:0;bottom:0}
.tinfo{display:flex;justify-content:space-between;width:100%;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.tinfo b{color:#fff}
/* hojas y diálogos */
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}
.box{background:var(--p1);border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:min(560px,100%);display:flex;flex-direction:column;gap:14px;max-height:92dvh;overflow:auto}
@media(min-width:700px){#modal{align-items:center}.box{border-radius:18px}}
.box h3{margin:0;font-size:19px;text-align:center}
.box p{margin:0;color:var(--mut)}
.row2{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sec{height:44px;padding:0 18px;border-radius:12px;background:var(--p2);border:1px solid var(--ln)}
.btnw{width:100%}
.menu{display:flex;flex-direction:column;gap:4px}
.menu button{height:48px;border-radius:12px;background:var(--p2);display:flex;align-items:center;gap:12px;padding:0 14px;text-align:left}
.menu button.red{color:#ff6b81}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.optrow span{color:var(--mut);font-size:13px}
.seg{display:flex;background:var(--p2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;height:36px;border-radius:8px;font-size:13px;color:var(--mut);white-space:nowrap;padding:0 8px}
.seg button.on{background:var(--p3);color:#fff;font-weight:600}
.est{text-align:center;color:var(--mut);font-size:13px}
/* exportación */
#xp{background:#000;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center;z-index:40}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px}
#xpv{width:min(520px,92vw);max-height:46dvh;border-radius:12px;background:#111}
.xbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%);background:#fff;color:#000;font-weight:600;padding:9px 16px;border-radius:10px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
#hidden{position:fixed;left:-10px;top:-10px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
kbd{background:var(--p3);border-radius:4px;padding:1px 6px;font:12px Inter}
/* ---------- modo PC ---------- */
body.pc .eh{height:56px;border-bottom:1px solid #1c1c1e;padding:0 14px}
body.pc #pname{text-align:left;flex:0 1 320px}
body.pc .eh .sp{display:block}
body.pc #main{padding:10px 0 0}
body.pc #side.on{display:flex}
body.pc .tw{height:clamp(200px,34dvh,340px);border-top:1px solid #1c1c1e}
body.pc .rlab{display:flex}
body.pc .tbar{scrollbar-width:thin;scrollbar-color:#333 transparent}body.pc .gtabs{justify-content:safe center}
body.pc .tool{width:76px}
body.pc #transport{border-top:1px solid #1c1c1e;height:48px}
.eh .sp{flex:1}
@media(max-width:420px){.tool{width:62px;font-size:10.5px}#tc{min-width:0}}
@media(max-width:520px){.reschip{display:none}#pname{font-size:14px;padding:6px 2px}.eh{gap:2px}}
@media(max-width:560px){.hero{grid-template-columns:1fr}.side2{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){#toast,.pbar i,.rec i{transition:none}}
</style>
</head>
<body>
<!-- ============ INICIO ============ -->
<section class="scr on" id="home">
  <div class="hh"><div class="logo"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></div><h1>YouCut video</h1><button class="ib" id="hSet" title="Ajustes" aria-label="Ajustes"></button></div>
  <div class="hero">
    <button class="newbig" id="newProj"><span class="plus"></span><b>Nuevo proyecto</b><small>Vídeos, fotos y GIF de tu dispositivo</small></button>
    <div class="side2">
      <button class="mini" id="newPhoto"><span id="icPhoto"></span><span>Presentación<small>Montaje con fotos</small></span></button>
      <button class="mini" id="newMusic"><span id="icMusic"></span><span>Vídeo musical<small>Clips + canción</small></span></button>
    </div>
  </div>
  <div class="hsec"><h2>Borradores</h2><span id="dcount"></span></div>
  <div class="drafts" id="drafts"></div>
</section>

<!-- ============ EDITOR ============ -->
<section class="scr" id="ed">
  <div class="eh">
    <button class="ib" id="btnHome" title="Volver al inicio" aria-label="Volver"></button>
    <input id="pname" value="YouCut video" aria-label="Nombre del proyecto">
    <div class="sp"></div>
    <button class="ib" id="btnMore" title="Más" aria-label="Más opciones"></button>
    <button class="reschip" id="resChip">1080P</button>
    <button class="save" id="btnSave">Guardar</button>
  </div>
  <div id="main">
    <div id="stage">
      <canvas id="cv" width="960" height="540"></canvas>
      <div id="empty"><p>Tu proyecto está vacío</p><button class="big" id="btnFirst">+ Añadir vídeos o fotos</button><p style="font-size:12px">También puedes arrastrar archivos aquí.</p></div>
      <div id="drop">Suelta para añadir</div>
    </div>
    <div id="side"></div>
  </div>
  <div id="transport">
    <button id="play" title="Reproducir (Espacio)" aria-label="Reproducir"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 4l13 8-13 8z"/></svg></button>
    <div id="tc"><b>00:00.0</b> / 00:00.0</div>
    <div class="sp"></div>
    <button class="ib" id="btnUndo" title="Deshacer (Ctrl+Z)" aria-label="Deshacer"></button>
    <button class="ib" id="btnRedo" title="Rehacer (Ctrl+Y)" aria-label="Rehacer"></button>
    <button class="ib" id="btnFull" title="Pantalla completa" aria-label="Pantalla completa"></button>
  </div>
  <div class="tw"><div id="tl"><div id="tli"></div></div><div id="ph"></div><button id="addEnd" title="Añadir clips" aria-label="Añadir clips"></button></div>
  <div id="dock">
    <div id="tools"></div>
    <div id="panel"><div class="phd"><button class="pbtn" id="pcancel" title="Cancelar" aria-label="Cancelar"></button><h3 id="ptitle"></h3><button class="pbtn ok" id="pok" title="Aplicar" aria-label="Aplicar"></button></div><div class="pbd" id="pbody"></div></div>
  </div>
</section>

<!-- ============ GUARDANDO ============ -->
<section class="scr" id="xp"></section>

<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<div id="hidden"></div>
<input type="file" id="fileIn" multiple hidden>

function addTo(k){fileTarget=k;fileIn.accept={main:'video/*,image/*',v2:'video/*,image/*',a1:'audio/*,video/*',a2:'audio/*,video/*',gif:'image/gif,image/webp,image/png',stkimg:'image/*'}[k]||'';if(k==='text'){addText();return}if(k==='stk'){openTool('stk');return}fileIn.value='';fileIn.click()}
fileIn.onchange=()=>importFiles([...fileIn.files],fileTarget);
async function importFiles(files,target){if(!files.length)return;ac();const before=snap();let n=0;let autoR=!P.main.length&&!P.v2.length&&target==='main'&&P.ratio==='16:9';if(files.length>1||files[0].size>5e6)toast('Cargando '+files.length+' archivo(s)…');
  for(const file of files){try{const s=await addSource(file);let k=target;
    if((k==='main'||k==='v2')&&s.kind==='audio')k='a1';
    if(k==='a1'||k==='a2'){if(s.kind!=='audio'&&s.kind!=='video'){toast('Eso no es audio');continue}placeAudio(newMedia(s),k==='a2')}
    else if(k==='gif'||k==='stkimg')addSticker({kind:s.kind==='gif'?'gif':'image',src:s.id},true);
    else if(k==='v2'){const c=newMedia(s);c.start=time;c.x=.73;c.y=.27;c.scale=.42;P.v2.push(c);sel={k:'v2',id:c.id}}
    else{const c=newMedia(s);const cur=mainAt(time);const i=cur?P.main.indexOf(cur)+1:P.main.length;P.main.splice(P.main.length&&time<total()-.05?i:P.main.length,0,c);if(autoR){autoR=false;if(s.h>s.w*1.05){P.ratio='9:16';setTimeout(sizeCanvas,30);setTimeout(()=>toast('Vídeo vertical: formato 9:16 (cámbialo en Lienzo)'),1500)}}}
    n++}catch(e){toast(e.message||'No se pudo abrir el archivo')}}
  if(n){commit(before);if(panelTool==='stk'||panelTool==='music')buildPanel();renderTools();toast(n===1?'Añadido':n+' archivos añadidos')}}
function newMedia(s){const img=s.kind==='image'||s.kind==='gif';return{id:uid(),src:s.id,in:0,out:img?(s.kind==='gif'?Math.max(3,s.dur):3):s.dur,speed:1,vol:1,muted:false,fin:0,fout:0,vfin:0,vfout:0,filter:'Original',fint:1,adj:{},fx:'none',fit:'fit',zoom:1,px:0,py:0,rot:0,stab:0,skey:s.id+':'+uid(),trans:{type:'none',dur:.8},start:0}}
function placeAudio(c,prefer2,at=time){const L=len(c);const free=k=>!P[k].some(o=>at<o.start+len(o)-1e-3&&at+L>o.start+1e-3);let k=prefer2?'a2':'a1';if(!free(k))k=k==='a1'?'a2':'a1';if(!free(k)){k='a1';c.start=Math.max(at,...P.a1.map(o=>o.start+len(o)))}else c.start=at;P[k].push(c);sel={k,id:c.id};return k}
function addText(){const before=snap();const o={id:uid(),start:time,dur:3,text:'Toca para editar',font:'Montserrat',size:96,color:'#ffffff',bold:true,stroke:'#000000',strokeW:0,bgOn:false,bgColor:'#000000',shadow:true,align:'center',lh:1.2,x:.5,y:.5,scale:1,rot:0,op:1,ain:'pop',aout:'fade',loop:'none',z:Date.now()};P.text.push(o);sel={k:'text',id:o.id};commit(before);renderTools();ptab.text='k';openTool('textedit')}
function addSticker(p,skip){const before=snap();const o={id:uid(),start:time,dur:p.dur||3,x:.5+(rnd(Date.now())-.5)*.3,y:.45+(rnd(Date.now()+1)-.5)*.3,scale:1,rot:0,op:1,ain:'none',aout:'none',loop:'none',z:Date.now(),...p};if(o.kind==='particles'){o.x=.5;o.y=.5}P.stk.push(o);sel={k:'stk',id:o.id};if(!skip){commit(before);toast('Añadido · arrástralo en la imagen')}else changed();renderTools();dirty=true}
function split(){const f=selClip()||(()=>{const c=mainAt(time);return c?{k:'main',c}:null})();if(!f){toast('No hay nada que dividir aquí');return}const {k,c}=f;const s=startOf(k,c),L=len(c),t=time;
  if(t<=s+.05||t>=s+L-.05){toast('Coloca el cabezal dentro del clip');return}const before=snap();const b=clone(c);b.id=uid();
  if(tType(k)==='ov'){c.dur=t-s;b.start=t;b.dur=L-(t-s);P[k].push(b)}
  else{const st=c.in+(t-s)*c.speed;c.out=st;b.in=st;c.fout=0;c.vfout=0;b.fin=0;b.vfin=0;if(k==='main'){b.trans=c.trans;c.trans={type:'none',dur:.8};P.main.splice(P.main.indexOf(c)+1,0,b)}else{b.start=t;P[k].push(b)}}
  sel={k,id:b.id};commit(before);renderTools();toast('Dividido')}
function delSel(){const f=selClip();if(!f){toast('Toca primero el clip que quieres eliminar');return}const before=snap();P[f.k]=P[f.k].filter(x=>x.id!==f.c.id);sel=null;commit(before);closePanel(true);renderTools()}
function duplicate(){const f=selClip()||ensureSel(['vid']);if(!f)return;const before=snap();const b=clone(f.c);b.id=uid();if(f.k==='main')P.main.splice(P.main.indexOf(f.c)+1,0,b);else{b.start=startOf(f.k,f.c)+len(f.c);if(b.z)b.z=Date.now();P[f.k].push(b)}sel={k:f.k,id:b.id};commit(before);renderTools();toast('Duplicado')}
function copySel(){const f=selClip()||ensureSel(['vid']);if(!f)return;clipboard={k:f.k,c:clone(f.c)};toast('Copiado · usa Pegar')}
function paste(){if(!clipboard){toast('Nada copiado todavía');return}if(clipboard.cs){const before=snap();const cs=clipboard.cs.map(c=>({...clone(c),id:uid()}));const cur=mainAt(time);P.main.splice(cur?P.main.indexOf(cur)+1:P.main.length,0,...cs);sel=null;commit(before);renderTools();toast(cs.length+' clips pegados');return}const before=snap();const b=clone(clipboard.c);b.id=uid();const k=clipboard.k;
  if(k==='main'){const cur=mainAt(time);P.main.splice(cur?P.main.indexOf(cur)+1:P.main.length,0,b)}else if(k[0]==='a')placeAudio(b,k==='a2');else{b.start=time;if(b.z)b.z=Date.now();P[k].push(b)}
  sel={k:findClip(b.id).k,id:b.id};commit(before);renderTools();toast('Pegado')}
function toggleMute(){const f=selClip();if(!f)return;const before=snap();f.c.muted=!f.c.muted;commit(before);renderTools();toast(f.c.muted?'Silenciado':'Sonido activado')}
function rotateClip(){const f=ensureSel(['vid']);if(!f)return;const before=snap();f.c.rot=((f.c.rot||0)+90)%360;commit(before);toast('Girado '+f.c.rot+'°');if(autoSel){autoSel=false;sel=null;renderTL();renderTools()}}
function flipClip(){const f=ensureSel(['vid']);if(!f)return;const before=snap();f.c.flipH=!f.c.flipH;commit(before);toast('Volteado');if(autoSel){autoSel=false;sel=null;renderTL();renderTools()}}
function extractAudio(){const f=selClip();if(!f||SRC[f.c.src]?.kind!=='video')return;const before=snap();const c=f.c;const a={...newMedia(SRC[c.src]),in:c.in,out:c.out,speed:c.speed,vol:c.vol??1};const k=placeAudio(a,false,startOf(f.k,c));c.muted=true;if(!SRC[c.src].wave)genWave(SRC[c.src]);commit(before);renderTools();toast('Audio extraído a '+(k==='a1'?'Música':'Audio 2'))}
function zorder(){const f=selClip();if(!f)return;const before=snap();f.c.z=Date.now();commit(before);toast('Traído al frente')}
async function freeze(){const f=ensureSel(['vid']);if(!f)return;const {k,c}=f;const s=SRC[c.src];if(!s||s.kind!=='video'){toast('Congelar funciona con vídeo');return}const r=RT.get(c.id);if(!r||r.el.readyState<2){toast('Espera a que cargue el vídeo');return}
  const s0=startOf(k,c),t=clamp(time,s0,s0+len(c)-.01);const cvf=document.createElement('canvas');const st0=c.in+(t-s0)*c.speed;if(HAS_WC&&s.dmx?.v&&s.vdOK){const vs=new VSrc(s,st0);try{const fr=await vs.frameAt(st0);const Rr=s.dmx.v.rot||0,fw=fr.displayWidth,fh=fr.displayHeight;cvf.width=Rr%180?fh:fw;cvf.height=Rr%180?fw:fh;const g=cvf.getContext('2d');g.translate(cvf.width/2,cvf.height/2);g.rotate(Rr*Math.PI/180);g.drawImage(fr,-fw/2,-fh/2,fw,fh)}finally{vs.close()}}else{cvf.width=s.w;cvf.height=s.h;cvf.getContext('2d').drawImage(r.el,0,0,s.w,s.h)}
  const blob=await new Promise(res=>cvf.toBlob(res,'image/jpeg',.92));const src=await addSource(new File([blob],'Congelado.jpg',{type:'image/jpeg'}));const before=snap();const fz={...newMedia(src),filter:c.filter,fint:c.fint,adj:clone(c.adj||{}),fit:c.fit,zoom:c.zoom,px:c.px,py:c.py,rot:c.rot,flipH:c.flipH,flipV:c.flipV};
  if(k==='main'){const idx=P.main.indexOf(c);if(t>s0+.05&&t<s0+len(c)-.05){const b=clone(c);b.id=uid();const st=c.in+(t-s0)*c.speed;c.out=st;b.in=st;b.trans=c.trans;c.trans={type:'none',dur:.8};P.main.splice(idx+1,0,fz,b)}else P.main.splice(t<=s0+.05?idx:idx+1,0,fz)}
  else{fz.start=t;fz.x=c.x;fz.y=c.y;fz.scale=c.scale;P.v2.push(fz)}
  sel={k,id:fz.id};autoSel=false;commit(before);renderTools();toast('Fotograma congelado 3 s')}

let recState=null;
async function startRec(){try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true}});const mr=new MediaRecorder(st);const ch=[];mr.ondataavailable=e=>e.data.size&&ch.push(e.data);recState={st,mr,ch,t0:time};mr.start();if(time>=total()-.05)time=0;recState.t0=time;await play();const b=$('#recB');if(b)b.classList.add('on');const tt=$('#recT');if(tt)tt.textContent='Grabando… pulsa para parar'}
  catch(e){toast('No se pudo usar el micrófono');recState=null}}
function stopRec(){const R=recState;if(!R)return;recState=null;pause();R.mr.onstop=async()=>{R.st.getTracks().forEach(t=>t.stop());const blob=new Blob(R.ch,{type:R.mr.mimeType||'audio/webm'});if(blob.size<1000){toast('Grabación vacía');return}const ext=(R.mr.mimeType||'').includes('mp4')?'m4a':'webm';
  const s=await addSource(new File([blob],'Voz '+new Date().toLocaleTimeString('es-ES')+'.'+ext,{type:blob.type}));const before=snap();placeAudio(newMedia(s),true,R.t0);commit(before);toast('Voz añadida');const b=$('#recB');if(b)b.classList.remove('on');const tt=$('#recT');if(tt)tt.textContent='Pulsa para grabar tu voz'};try{R.mr.stop()}catch(e){}}

function addBlack(){const before=snap();const c={id:uid(),src:null,color:'#000000',in:0,out:15,speed:1,vol:1,muted:true,fin:0,fout:0,vfin:0,vfout:0,filter:'Original',fint:1,adj:{},fx:'none',fit:'fit',zoom:1,px:0,py:0,rot:0,stab:0,skey:'',trans:{type:'none',dur:.8},start:0};P.main.push(c);sel={k:'main',id:c.id};commit(before);renderTools();seek(c._s+.01);toast('Fondo negro de 15 s añadido al final · cambia color y segundos en Duración')}
function nrChain(ctx,lvl){const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=[0,90,130,170][lvl];hp.Q.value=.7;
  const n1=ctx.createBiquadFilter();n1.type='notch';n1.frequency.value=50;n1.Q.value=10;const n2=ctx.createBiquadFilter();n2.type='notch';n2.frequency.value=100;n2.Q.value=10;
  const lpf=ctx.createBiquadFilter();lpf.type='lowpass';lpf.frequency.value=[20000,12500,9500,7500][lvl];lpf.Q.value=.6;
  const pk=ctx.createBiquadFilter();pk.type='peaking';pk.frequency.value=2800;pk.Q.value=.8;pk.gain.value=[0,1.5,2.5,3.5][lvl];
  hp.connect(n1);n1.connect(n2);n2.connect(lpf);lpf.connect(pk);return{i:hp,o:pk}}
async function capture(){pause();const res=Math.max(1080,P.res);const [w,h]=dims(res);const xc=document.createElement('canvas');xc.width=w;xc.height=h;const x=xc.getContext('2d',{alpha:false});const map=new Map(),vss=[];
  try{for(const [k,arr] of [['main',P.main],['v2',P.v2]])for(const c of arr){const s=SRC[c.src];const s0=startOf(k,c);if(!s||s.kind!=='video'||time<s0||time>=s0+len(c))continue;const st=c.in+(time-s0)*c.speed;
      if(HAS_WC&&s.dmx?.v&&s.vdOK){const vs=new VSrc(s,st);vss.push(vs);const fr=await vs.frameAt(st);if(fr)map.set(c.id,fr)}else{const r=RT.get(c.id);if(r)map.set(c.id,r.el)}}
    EXF=map;drawFrame(x,w,h,time,false)}finally{EXF=null;vss.forEach(v=>v.close())}
  const blob=await new Promise(r=>xc.toBlob(r,'image/jpeg',.95));await saveFile(blob,(P.name||'Captura')+' '+fmt(time).replace(':','m').replace('.','s')+'.jpg')}
function subStyleOf(){const st=P.subSt||(P.subSt={size:64,color:'#ffffff',bg:1,y:.88});return{size:st.size,color:st.color,bgOn:!!st.bg,bgColor:'#000000',strokeW:st.bg?0:4,stroke:'#000000',y:st.y}}
function applySubSt(){const s2=subStyleOf();P.text.forEach(o=>{if(o.sub)Object.assign(o,s2)});dirty=true;buildPanel()}
function addSub(t=time,dur=2.5,text=''){const nxt=P.text.filter(o=>o.sub&&o.start>t+.05).sort((a,b)=>a.start-b.start)[0];if(nxt)dur=Math.max(.3,Math.min(dur,nxt.start-t));const o={id:uid(),sub:true,start:t,dur,text,font:'Inter',bold:true,it:false,shadow:true,align:'center',lh:1.15,x:.5,scale:1,rot:0,op:1,ain:'none',aout:'none',loop:'none',z:1,...subStyleOf()};P.text.push(o);live();return o}
function importSrt(){const inp=document.createElement('input');inp.type='file';inp.accept='.srt,.vtt,.txt,text/plain';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const txt=(await f.text()).replace(/\r/g,'');const tm=s=>{const m=s.match(/(?:(\d+):)?(\d+):(\d+)[,.](\d+)/);return m?(+(m[1]||0))*3600+(+m[2])*60+(+m[3])+(+m[4])/1000:null};let n=0;
  for(const blk of txt.split(/\n\s*\n/)){const ls=blk.split('\n').filter(l=>l.trim());const ti=ls.findIndex(l=>l.includes('-->'));if(ti<0)continue;const [a,b]=ls[ti].split('-->');const t0=tm(a),t1=tm(b);if(t0==null||t1==null)continue;const o=addSub(t0,Math.max(.2,t1-t0),ls.slice(ti+1).join('\n').replace(/<[^>]+>/g,''));o.dur=Math.max(.2,t1-t0);n++}
  live();buildPanel();toast(n+' subtítulos importados')};inp.click()}
function exportSrt(){const subs=P.text.filter(o=>o.sub).sort((a,b)=>a.start-b.start);if(!subs.length){toast('Aún no hay subtítulos');return}const ts=t=>{const ms=Math.round(t*1000);const h=Math.floor(ms/3600000),m=Math.floor(ms/60000)%60,s=Math.floor(ms/1000)%60;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(ms%1000).padStart(3,'0')}`};
  const out=subs.map((o,i)=>`${i+1}\n${ts(o.start)} --> ${ts(o.start+o.dur)}\n${o.text}\n`).join('\n');saveFile(new Blob([out],{type:'text/plain'}),(P.name||'subtitulos')+'.srt')}
function blockRange(){if(!BLK)return null;const a=P.main.findIndex(c=>c.id===BLK.a),b=P.main.findIndex(c=>c.id===BLK.b);if(a<0||b<0)return null;return[Math.min(a,b),Math.max(a,b)]}
function inBlock(k,i){if(k!=='main'||panelTool!=='block')return false;const r=blockRange();return!!r&&i>=r[0]&&i<=r[1]}
function blockAction(v){const r=blockRange();if(!r)return;const [a,b]=r;const cs=P.main.slice(a,b+1);
  if(v==='copy'){clipboard={k:'main',cs:clone(cs)};toast(cs.length+' clips copiados · usa Pegar')}
  else if(v==='dup'){const cp=cs.map(c=>({...clone(c),id:uid()}));P.main.splice(b+1,0,...cp);toast('Bloque duplicado')}
  else if(v==='left'&&a>0){const [x]=P.main.splice(a-1,1);P.main.splice(b,0,x)}
  else if(v==='right'&&b<P.main.length-1){const [x]=P.main.splice(b+1,1);P.main.splice(a,0,x)}
  else if(v==='del'){P.main.splice(a,cs.length);sel=null;closePanel();toast('Bloque eliminado');return}
  live();renderTL();buildPanel()}

let pdrag=null;
function cvPt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]}
function hit(px,py){for(let i=bounds.length-1;i>=0;i--){const b=bounds[i];if(b.full)continue;const dx=px-b.cx,dy=py-b.cy,co=Math.cos(-b.r),si=Math.sin(-b.r);const lx=dx*co-dy*si,ly=dx*si+dy*co;if(Math.abs(lx)<=b.w/2+8&&Math.abs(ly)<=b.h/2+8)return{b}}return null}
cv.addEventListener('pointerdown',e=>{if(exporting)return;const [px,py]=cvPt(e);
  if(panelTool==='pix'){const p=selClip()?.c.pix;if(p){const W=cv.width,H=cv.height;const corner=Math.hypot(px-(p.x+p.w)*W,py-(p.y+p.h)*H)<Math.max(24,W/35);if(corner||(px>=p.x*W&&px<=(p.x+p.w)*W&&py>=p.y*H&&py<=(p.y+p.h)*H)){pdrag={mode:corner?'pixs':'pixm',p,px,py,o:{...p}};cv.setPointerCapture(e.pointerId)}}return}
  if(sel){const b=bounds.find(b=>b.id===sel.id);if(b&&!b.full){const dx=px-b.cx,dy=py-b.cy,co=Math.cos(-b.r),si=Math.sin(-b.r);const lx=dx*co-dy*si,ly=dx*si+dy*co;if(Math.hypot(lx-b.w/2,ly-b.h/2)<Math.max(22,cv.width/40)){const c=findClip(sel.id).c;pdrag={mode:'scale',c,d0:Math.hypot(dx,dy),s0:sel.k==='v2'?c.scale??.5:c.scale||1,before:snap()};cv.setPointerCapture(e.pointerId);return}}}
  const h=hit(px,py);if(!h){if(sel&&tType(sel.k)!=='aud'&&sel.k!=='main')deselect();else if(!sel)toggle();return}
  if(!sel||sel.id!==h.b.id)select(h.b.k,h.b.id);const c=findClip(h.b.id).c;pdrag={mode:'move',c,px,py,x0:c.x??.5,y0:c.y??.5,before:snap()};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!pdrag)return;const [px,py]=cvPt(e);if(pdrag.p){const p=pdrag.p,o=pdrag.o,dx=(px-pdrag.px)/cv.width,dy=(py-pdrag.py)/cv.height;if(pdrag.mode==='pixm'){p.x=clamp(o.x+dx,0,1-p.w);p.y=clamp(o.y+dy,0,1-p.h)}else{p.w=clamp(o.w+dx,.03,1-p.x);p.h=clamp(o.h+dy,.03,1-p.y)}dirty=true;return}const c=pdrag.c;
  if(pdrag.mode==='move'){c.x=clamp(pdrag.x0+(px-pdrag.px)/cv.width,-.2,1.2);c.y=clamp(pdrag.y0+(py-pdrag.py)/cv.height,-.2,1.2);if(Math.abs(c.x-.5)<.012)c.x=.5;if(Math.abs(c.y-.5)<.012)c.y=.5}
  else{const b=bounds.find(b=>b.id===c.id);if(!b)return;c.scale=clamp(pdrag.s0*Math.hypot(px-b.cx,py-b.cy)/pdrag.d0,.05,8)}dirty=true});
cv.addEventListener('pointerup',()=>{if(!pdrag)return;if(pdrag.p){pdrag=null;return}if(pdrag.before!==snap())commit(pdrag.before);pdrag=null});
cv.addEventListener('wheel',e=>{const f=selClip();if(!f||(f.k!=='v2'&&tType(f.k)!=='ov'))return;e.preventDefault();const c=f.c;const fk=e.deltaY<0?1.06:1/1.06;if(f.k==='text')c.size=clamp(c.size*fk,10,400);else c.scale=clamp((c.scale??(f.k==='v2'?.5:1))*fk,.05,8);dirty=true;clearTimeout(cv.wt);if(!cv.wb)cv.wb=snap();cv.wt=setTimeout(()=>{commit(cv.wb);cv.wb=null},500)},{passive:false});
let cvPinch=null;cv.addEventListener('touchstart',e=>{const f=selClip();if(e.touches.length===2&&f&&(f.k==='v2'||tType(f.k)==='ov')){pdrag=null;const [a,b]=e.touches;cvPinch={d0:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),s0:f.k==='text'?f.c.size:(f.c.scale??(f.k==='v2'?.5:1)),c:f.c,k:f.k,before:snap()}}},{passive:true});
cv.addEventListener('touchmove',e=>{if(cvPinch&&e.touches.length===2){e.preventDefault();const [a,b]=e.touches;const r=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/cvPinch.d0;if(cvPinch.k==='text')cvPinch.c.size=clamp(cvPinch.s0*r,10,400);else cvPinch.c.scale=clamp(cvPinch.s0*r,.05,8);dirty=true}},{passive:false});
cv.addEventListener('touchend',e=>{if(cvPinch&&e.touches.length<2){commit(cvPinch.before);cvPinch=null}});

$('#hSet').onclick=settingsSheet;$('#btnMore').onclick=settingsSheet;

/* ============ eventos generales ============ */
$('#play').onclick=toggle;$('#btnUndo').onclick=undo;$('#btnRedo').onclick=redo;$('#btnSave').onclick=exportSheet;$('#resChip').onclick=exportSheet;$('#btnFirst').onclick=()=>addTo('main');$('#addEnd').onclick=()=>addTo('main');
$('#pname').oninput=e=>{P.name=e.target.value;saveSoon()};
$('#btnFull').onclick=()=>{const el=$('#stage');try{(document.fullscreenElement?document.exitFullscreen():el.requestFullscreen?.()||el.webkitRequestFullscreen?.())?.catch?.(()=>{})}catch(e){}};
document.addEventListener('keydown',e=>{if(!inEditor||e.target.matches('input,textarea,select'))return;if($('#modal').classList.contains('on')){if(e.key==='Escape'&&!exporting)closeModal();return}if(exporting)return;const c=e.ctrlKey||e.metaKey;const k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();toggle()}else if(c&&k==='z'&&!e.shiftKey){e.preventDefault();undo()}else if(c&&(k==='y'||(k==='z'&&e.shiftKey))){e.preventDefault();redo()}
  else if(c&&k==='c')copySel();else if(c&&k==='v')paste();else if(c&&k==='d'){e.preventDefault();duplicate()}else if(k==='s'&&!c)split();else if(k==='delete'||k==='backspace')delSel();
  else if(k==='arrowleft'||k==='arrowright'){e.preventDefault();seek(time+(k==='arrowleft'?-1:1)*(e.shiftKey?1:1/P.fps))}else if(k==='home')seek(0);else if(k==='end')seek(total());else if(k==='escape'){if(panelTool)cancelPanel();else deselect()}else if(k==='+'||k==='=')setZoom(pps*1.3);else if(k==='-')setZoom(pps/1.3)});
let dragDepth=0;const dr=$('#drop');
addEventListener('dragenter',e=>{if(inEditor&&e.dataTransfer?.types?.includes('Files')){dragDepth++;dr.style.display='flex'}});addEventListener('dragleave',()=>{if(--dragDepth<=0){dragDepth=0;dr.style.display='none'}});addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragDepth=0;dr.style.display='none';if(!inEditor)return;const fs=[...e.dataTransfer.files];const vis=fs.filter(f=>kindOf(f)&&kindOf(f)!=='audio'),aud=fs.filter(f=>kindOf(f)==='audio');if(vis.length)importFiles(vis,'main').then(()=>aud.length&&importFiles(aud,'a1'));else if(aud.length)importFiles(aud,'a1')});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(inEditor&&!exporting){pause();saveNow()}if(exporting&&!exporting.offline)toast('Vuelve a esta pantalla: la grabación se pausa en segundo plano')}});

/* iconos estáticos */
setIco('#hSet','gear');setIco('#btnHome','back');setIco('#btnMore','gear');setIco('#btnUndo','undo');setIco('#btnRedo','redo');setIco('#btnFull','full');setIco('#addEnd','add');setIco('#pcancel','x');setIco('#pok','check');$('.newbig .plus').innerHTML=ico('add');setIco('#icPhoto','img');setIco('#icMusic','music');

/* arranque */
(async()=>{const s=await idbGet('kv','settings');if(s)SET={...SET,...s};applyMode();
  const old=await idbGet('kv','project');if(old){try{const d=JSON.parse(old);if(d.main?.length){d.id=d.id||uid();await idbPut('projects',d.id,{id:d.id,name:d.name||'Proyecto',updated:Date.now(),dur:0,thumb:'',data:JSON.stringify(d)})}}catch(e){}idbDel('kv','project')}
  renderHome()})();
requestAnimationFrame(tick);
window.__yc={HAS_WC,SET:()=>SET,get EXP(){return exporting},get P(){return P},SRC,RT,importFiles,seek,play,pause,split,select,openTool,closePanel,get time(){return time},total,STAB,goHome,openProject,newProj,get sel(){return sel}};
}
</script>
</body>
</html>
